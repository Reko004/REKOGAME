<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dönərxana Menyusu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f8f8f8;
        }
        .menu {
            margin-top: 50px;
        }
        .item {
            font-size: 24px;
            margin: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-in-out;
        }
        img {
            width: 150px;
            height: auto;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.8s ease-in-out;
        }
        .show {
            opacity: 1;
            transform: translateY(0);
        }
        .show img {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>
    <h1>Dönərxana Menyusu</h1>
    <div class="menu">
        <div class="item">
            <img src="https://via.placeholder.com/150" alt="Dönər">
            <p>Dönər - 5 AZN</p>
        </div>
        <div class="item">
            <img src="https://via.placeholder.com/150" alt="Lavaş Dönər">
            <p>Lavaş Dönər - 6 AZN</p>
        </div>
        <div class="item">
            <img src="https://via.placeholder.com/150" alt="Ayran">
            <p>Ayran - 1 AZN</p>
        </div>
    </div>
    <script>
        window.addEventListener("load", () => {
            document.querySelectorAll(".item").forEach((item, index) => {
                setTimeout(() => {
                    item.classList.add("show");
                }, index * 500);
            });
        });
    </script>
</body>
</html>
